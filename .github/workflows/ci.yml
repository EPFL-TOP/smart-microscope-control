name: CI

# ADR-0009: a pull request and a push to main run the light set (`lint & types`
# and two test jobs); the nightly, a manual dispatch and a pull request that
# carries the label `ci: full` run the full matrix. scripts/ci/select_matrix.py
# owns the choice. The names of the jobs below are the contract with the
# required checks of `main`: do not rename them.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 02:17 UTC: GitHub delays the runs that are queued on the hour.
    - cron: "17 2 * * *"
  workflow_dispatch:

# A newer push cancels the older run of the same PR, and a push to main cancels
# the older run of main's push (the newer commit contains the older). The
# nightly and a dispatch are never cancelled by a push: the event is in the
# group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint & types
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # select_matrix.py reads the labels of the pull request.
      pull-requests: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      serial: ${{ steps.select.outputs.serial }}
    steps:
      - uses: actions/checkout@v7
      # The label is read from the API when the run starts, not from the event
      # payload: `gh pr create --label` may attach it after `opened` fired, and
      # a re-run replays its original payload. A label added later takes effect
      # on the next run (a push, or "Re-run all jobs").
      - name: Choose the test jobs (the light set or the full matrix)
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/select_matrix.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each entry is {os, python}; the entries and why they are there are in
      # scripts/ci/select_matrix.py.
      matrix: ${{ fromJSON(needs.lint.outputs.matrix) }}
    env:
      # The demo devices are the regression bed: a missing install must fail,
      # not skip.
      SMC_REQUIRE_MM: "1"
      # The plate page's tests (m3 §15) likewise fail, not skip, when the extra is missing.
      SMC_REQUIRE_UI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # `lint` installs `.[dev]` only: it proves that `mypy` passes without the ui extra.
      - run: python -m pip install -e ".[dev,ui]"
      # Authenticated equivalent of `mmcore install --test-adapters`: the
      # unauthenticated GitHub API call inside pymmcore-plus hits the shared
      # runners' rate limit (HTTP 403).
      - name: Install Micro-Manager demo device adapters
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/install_mm_test_adapters.py
      # The nightly and a dispatch run the whole suite in order, with coverage.
      - name: Run tests
        if: ${{ needs.lint.outputs.serial == 'true' }}
        run: pytest --cov=smc --cov-report=term --cov-report=xml --junitxml=junit.xml
      # A pull request and a push run in parallel, without coverage (two
      # invocations cannot share one coverage file), the tests that assert on a
      # measured duration or a frame rate (marker `wallclock`) apart. Every `-m`
      # carries `not hardware`: a `-m` on the command line replaces the
      # `-m 'not hardware'` of addopts (FM-192). Two steps, not two commands in
      # one `run:`: on a Windows runner a multi-line `run:` reports only the
      # exit code of its last command.
      - name: Run tests in parallel
        if: ${{ needs.lint.outputs.serial != 'true' }}
        run: pytest -n auto -m "not hardware and not wallclock" --junitxml=junit.xml
      - name: Run the wall-clock tests in order
        if: ${{ !cancelled() && needs.lint.outputs.serial != 'true' }}
        run: pytest -m "wallclock and not hardware" --junitxml=junit-wallclock.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
      # The nightly's report names the failing tests from these files. A job
      # whose process aborted leaves none (FM-179), so the report also reads the
      # jobs' own conclusions.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit.xml
            junit-wallclock.xml
          if-no-files-found: ignore
          retention-days: 7

  # ADR-0009: the nightly and a dispatch report themselves in one issue
  # (`CI nightly red`): opened on a red run, one line on the next red run,
  # closed on a green one. A pull request or a push never runs this job.
  nightly-report:
    name: nightly report
    needs: [lint, test]
    # always(): the report must run when the tests failed, which is its point.
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      # One folder per test job under junit/. A job whose process aborted
      # uploaded nothing (FM-179), and a run with no artifact at all must still
      # open its issue: the report reads the jobs' own conclusions too.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: junit-*
          path: junit
      - name: Open, update or close the nightly's issue
        env:
          GH_TOKEN: ${{ github.token }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: python3 scripts/ci/nightly_report.py
