name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.11" } # the microscope PCs run 3.11
          - { os: macos-latest, python: "3.13" }
    env:
      # The demo devices are the regression bed: a missing install must fail,
      # not skip.
      SMC_REQUIRE_MM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Authenticated equivalent of `mmcore install --test-adapters`: the
      # unauthenticated GitHub API call inside pymmcore-plus hits the shared
      # runners' rate limit (HTTP 403).
      - name: Install Micro-Manager demo device adapters
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/install_mm_test_adapters.py
      - name: Run tests
        run: pytest --cov=smc --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
