name: Bug
description: Something behaves wrongly.
title: "bug: "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, config, profile. Say whether it reproduces on the demo devices.
      render: shell
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Paste the output of `smc version` and, if relevant, `smc doctor`.
      render: text
  - type: dropdown
    id: microscope
    attributes:
      label: Microscope
      options: ["demo devices", "Nikon Ti2", "Nikon Ti-E", "Zeiss Axio Observer 7", "Viventis LS1", "other / n/a"]
