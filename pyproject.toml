[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smart-microscope-control"
version = "0.0.1"
description = "Vendor-agnostic microscope control with interchangeable tools (plugins), built on Micro-Manager / pymmcore-plus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EPFL UPOATES lab" }]
keywords = ["microscopy", "micro-manager", "pymmcore-plus", "automation", "smart-microscopy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # The hardware bus. [cli] provides `mmcore install`, which fetches the
  # Micro-Manager device adapters (or the demo adapters on unsupported hosts).
  "pymmcore-plus[cli]>=0.18,<0.20",
  # The ecosystem's acquisition description: MDASequence, WellPlatePlan, grids.
  "useq-schema>=0.9",
  "numpy>=1.26",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  # Serial ports with their USB IDs for `smc discover` (the survey of a PC).
  "pyserial>=3.5",
  # TOML profiles on Python 3.10 (tomllib is stdlib from 3.11).
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-pyserial>=3.5",
  "pre-commit>=3.7",
]
# Zeiss stands reached through Zeiss MTB 2011 (.NET) — Windows only.
zeiss = ["pythonnet>=3.0; sys_platform == 'win32'"]
# User interface extra: populated once ADR-0006 is accepted.
ui = []

[project.scripts]
smc = "smc.cli:main"

# Plugins register here (see ADR-0004). Third-party packages can add their own.
[project.entry-points."smc.plugins"]

[project.urls]
Homepage = "https://github.com/EPFL-TOP/smart-microscope-control"
Issues = "https://github.com/EPFL-TOP/smart-microscope-control/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/smc"]

# ----------------------------------------------------------------------------
# Lint / format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Preview is on only so that individually selected preview rules (PLW1514)
# apply; rule *groups* stay on their stable members.
preview = true
explicit-preview-rules = true
# Stage units are written µm (MICRO SIGN) throughout; do not flag it as a
# confusable for the Greek mu.
allowed-confusables = ["µ"]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "N",        # pep8-naming
  "RUF",      # ruff-specific
  "PT",       # pytest style
  "T20",      # no print in library code (tests/scripts are exempt below)
  "PLW1514",  # open()/read_text() without encoding= — Windows decodes with cp1252
  "TID251",   # banned imports: hardware only through smc.hardware (below)
  "D",        # docstrings — public API must say *why*, not just *what*
]
ignore = [
  "D100", "D104",   # module / package docstrings are optional
  "D105", "D107",   # magic methods / __init__ need no docstring
  "D203", "D213",   # incompatible with D211 / D212 (Google style)
  "E501",           # the formatter owns line length
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "T20", "S101", "TID251"]
"scripts/**" = ["D", "T20", "TID251"]
"src/smc/cli.py" = ["T20"]   # the CLI is allowed to talk
# The only packages that may import the Micro-Manager bindings (CLAUDE.md):
# the hardware layer, the read-only survey (throwaway cores, design §10) and
# the test helpers (FakeCore, demo fixtures).
"src/smc/hardware/**" = ["TID251"]
"src/smc/discovery/**" = ["TID251"]
"src/smc/testing/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pymmcore_plus".msg = "Hardware is reached only through smc.hardware (ADR-0003, CLAUDE.md); ask for a capability instead."
"pymmcore".msg = "Hardware is reached only through smc.hardware (ADR-0003, CLAUDE.md); ask for a capability instead."

[tool.ruff.format]
docstring-code-format = true

# ----------------------------------------------------------------------------
# Types
# ----------------------------------------------------------------------------
[tool.mypy]
# No python_version pin: numpy's stubs use 3.12 syntax, and CI runs mypy on 3.12.
files = ["src/smc"]
strict = true
warn_unreachable = true
pretty = true
# Upstream packages without complete stubs.
[[tool.mypy.overrides]]
module = ["pymmcore.*", "pymmcore_plus.*", "useq.*"]
ignore_missing_imports = true
follow_untyped_imports = true

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Hardware tests are opt-in: `pytest -m hardware --profile nikon-ti2` at the scope.
addopts = "-ra -m 'not hardware'"
markers = [
  "hardware: needs a real microscope; deselected by default (see ADR-0005)",
  "demo: runs against Micro-Manager's demo devices (needs `mmcore install`)",
]
filterwarnings = ["error::DeprecationWarning:smc.*"]

[tool.coverage.run]
source = ["smc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
