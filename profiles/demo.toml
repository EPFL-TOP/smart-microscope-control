# Micro-Manager demo devices — the simulator every tool must run on.
# Schema draft (ADR-0003); the loader arrives with milestone M1.

[microscope]
name = "demo"
vendor = "Micro-Manager"
description = "DemoCamera adapter: simulated camera, XY stage, Z, turret, shutter, autofocus."

[micromanager]
# Empty = load the demo configuration shipped with the device adapters.
config = ""
device_timeout_ms = 60000

[roles]
# Overrides only. Anything not listed is resolved from the core's own role
# slots, then from type-first heuristics (candidates are reported).
# xy_stage = "XY"
# objective_turret = "Objective"

[safety]
max_jog_um = 5000.0        # a relative move above this is refused unless forced
z_soft_limits_um = [-1000.0, 1000.0]
turret_requires_confirm = true

[camera]
# µm per pixel per objective label. 0 or missing = unknown, never guessed.
pixel_size_um = { "Nikon 10X S Fluor" = 0.65, "Nikon 40X Plan Fluor ELWD" = 0.1625 }

[quirks]
# Behaviours the facade must encode for this stand. None for the simulator.
